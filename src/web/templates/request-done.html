<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Enigma — done</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    max-width: 600px;
    margin: 10vh auto 0;
    padding: 0 16px;
    box-sizing: border-box;
    color: #18181b;
    background: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #e4e4e7; background: #18181b; }
    .card { border-color: #3f3f46 !important; background: #27272a !important; }
  }
  * { box-sizing: border-box; }
  .card { border: 1px solid #e4e4e7; border-radius: 12px; padding: 20px; }
  h1 { font-size: 1.1rem; margin: 0 0 12px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 6px 0; border-top: 1px solid #e4e4e7; }
  li:first-child { border-top: none; }
  .ok { color: #16a34a; }
  .fail { color: #dc2626; }
  p.muted { color: #71717a; margin-top: 16px; font-size: 0.9rem; }
</style>
</head>
<body>
  <div class="card">
    <h1>Request complete</h1>
    <ul>
      <!--BLOCK:RESULT_ROW-->
      <li class="{{STATUS_CLASS}}">{{NAME}} — {{STATUS_TEXT}}</li>
      <!--/BLOCK:RESULT_ROW-->
    </ul>
    <p class="muted">This tab closes automatically in a few seconds — or you can close it now.</p>
  </div>
  <script src="/static/request-done.js"></script>
</body>
</html>
