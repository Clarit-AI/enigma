<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Enigma — reveal {{NAME}}</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    max-width: 600px;
    margin: 10vh auto 0;
    padding: 0 16px;
    box-sizing: border-box;
    color: #18181b;
    background: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #e4e4e7; background: #18181b; }
    .card { border-color: #3f3f46 !important; background: #27272a !important; }
    button { background: #e4e4e7 !important; color: #18181b !important; }
    code { background: #3f3f46 !important; }
  }
  * { box-sizing: border-box; }
  .card { border: 1px solid #e4e4e7; border-radius: 12px; padding: 20px; }
  h1 { font-size: 1.1rem; margin: 0 0 4px; }
  p.muted { color: #71717a; margin: 4px 0 16px; }
  button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #18181b; color: #fff; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  code { display: block; word-break: break-all; background: #f4f4f5; padding: 10px; border-radius: 8px; margin-top: 12px; }
  #status { margin-top: 12px; color: #71717a; font-size: 0.9rem; }
</style>
</head>
<body>
  <div class="card">
    <h1>Reveal {{NAME}}</h1>
    <p class="muted">This link works once. The value never appears until you click Reveal, and it is hidden again after 60 seconds.</p>
    <button id="revealBtn" type="button" data-id="{{ID}}">Reveal</button>
    <code id="valueBox" hidden></code>
    <p id="status"></p>
  </div>
  <script src="/static/reveal.js"></script>
</body>
</html>
