name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run leak-fence
      - run: npm run build
      - name: Verify committed bundles match source
        run: |
          if [ -n "$(git status --porcelain plugins/enigma/dist)" ]; then
            echo "::error::plugins/enigma/dist is stale — run 'npm run build' and commit the result."
            git status --porcelain plugins/enigma/dist
            exit 1
          fi
      - run: npm audit --audit-level=high
      - run: npm run check:native

  # Validates the COMMITTED native artifacts (the bytes a marketplace
  # install runs) on each supported platform: binary digest, source
  # staleness metadata, then a real dlopen+lock smoke of the shipped file.
  # The fresh-rebuild step is labeled separately — a rebuilt replacement
  # passing its own smoke does NOT validate what installs ship.
  native-artifacts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: darwin-arm64
          - runner: macos-15-intel
            label: darwin-x64
          - runner: ubuntu-22.04
            label: linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Validate committed artifact (shipped bytes) — ${{ matrix.label }}
        run: node scripts/check-native.mjs
      - name: Fresh-rebuild smoke (does NOT validate shipped bytes) — ${{ matrix.label }}
        run: |
          node scripts/build-native.mjs
          node scripts/check-native.mjs

  toolchain-guard:
    # Issue #29: proves the stale/absent-node_modules guard actually fires,
    # rather than trusting it by inspection. Deliberately skips `npm ci` and
    # asserts a gate command fails loudly, naming `npm ci`, instead of
    # silently resolving some other toolchain.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Verify gate commands refuse to run without npm ci
        run: |
          set +e
          output="$(npm test 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error::npm test succeeded without npm ci — the toolchain guard did not fire."
            exit 1
          fi
          if ! echo "$output" | grep -q "npm ci"; then
            echo "::error::npm test failed as expected, but the error did not name 'npm ci'."
            exit 1
          fi
