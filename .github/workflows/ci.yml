name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run leak-fence
      - run: npm run build
      - name: Verify committed bundles match source
        run: |
          if [ -n "$(git status --porcelain plugins/enigma/dist)" ]; then
            echo "::error::plugins/enigma/dist is stale — run 'npm run build' and commit the result."
            git status --porcelain plugins/enigma/dist
            exit 1
          fi
      - run: npm audit --audit-level=high
