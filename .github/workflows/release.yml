name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # Required for `npm publish --provenance` once it actually publishes (see
  # the dry-run note below); harmless while the step stays a dry run.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run leak-fence
      - run: npm run build
      - name: Verify dist/ matches committed output
        run: |
          if [ -n "$(git status --porcelain plugins/enigma/dist)" ]; then
            echo "::error::Release aborted: plugins/enigma/dist does not match its committed source for this tag. Run 'npm run build' and commit the result before tagging a release."
            git status --porcelain plugins/enigma/dist
            exit 1
          fi
      - run: npm audit --audit-level=high
      - name: Publish to npm (dry run)
        # The @clarit.ai npm scope is not claimed yet (see RELEASING.md), so
        # this step is a DELIBERATE, hardcoded dry run — not conditional on a
        # secret or token being present — so a real tag can never trigger a
        # surprise live publish attempt. --dry-run performs the full pack and
        # preflight locally without any registry write and without requiring
        # npm auth (verified locally: `npm publish --provenance --dry-run
        # --access public` succeeds while signed out). Once the scope is
        # claimed, RELEASING.md documents removing --dry-run and adding the
        # NPM_TOKEN / trusted-publisher configuration this step will then need.
        run: |
          echo "::notice::DRY RUN — @clarit.ai npm scope is not yet claimed. No package is being published. See RELEASING.md for the follow-up to enable a real publish."
          npm publish --provenance --dry-run --access public
